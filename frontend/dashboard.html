<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .navbar {
            background-color: #1e293b;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
        }

        .container {
            padding: 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin: 0;
            color: #555;
        }

        .card p {
            font-size: 22px;
            font-weight: bold;
        }

        .section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        button {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #dc2626;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <h2>Smart Interview Prep</h2>
        <button onclick="logout()">Logout</button>
    </div>

    <div class="container">

        <h2>Welcome to Dashboard 🎉</h2>

        <!-- Stats -->
        <div class="cards">
            <div class="card">
                <h3>Problems Solved</h3>
                <p>120</p>
            </div>

            <div class="card">
                <h3>Mock Interviews</h3>
                <p>5</p>
            </div>

            <div class="card">
                <h3>Streak</h3>
                <p>10 Days</p>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="section">
            <h3>Recent Activity</h3>
            <ul>
                <li>Solved Two Sum</li>
                <li>Completed Mock Interview</li>
                <li>Solved Binary Search</li>
            </ul>
        </div>

    </div>

<script>
function logout() {
    localStorage.removeItem("token");
    window.location.href = "login.html";
}

// Optional: Protect dashboard (redirect if not logged in)
if (!localStorage.getItem("token")) {
    window.location.href = "login.html";
}
</script>

</body>
</html>
